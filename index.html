<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ignis Cup — Ranking da equipe</title>
<link rel="icon" href="assets/logo.png">
<meta name="description" content="Ranking e pontuação da Ignis Cup, semana a semana e por universo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="mark">
      <button class="logo-slot" id="logoSlot" aria-label="Adicionar ou trocar a logo do projeto"
              title="Clique para adicionar ou trocar a logo">
        <img id="logoImg" alt="Logo do projeto" src="assets/logo.png">
        <span class="logo-ph" id="logoPh" hidden>
          <svg viewBox="0 0 24 32" width="20" height="27" aria-hidden="true">
            <path d="M13.4 0C13.9 6.2 9.1 8.1 6.2 11.9 3.4 15.5 2 18.6 2 21.6 2 27.3 6.6 32 12.3 32S22.6 27.3 22.6 21.6c0-3.5-1.6-6.1-4.2-8.8.3 2.4-.4 4-1.8 4.7 .9-4.3-.6-9.9-3.2-13.5z" fill="var(--blue)"/>
            <path d="M12.4 32c-3 0-5.4-2.4-5.4-5.4 0-2.5 2.1-4.3 3.6-6.6.6 2.2 2 3 2.9 4.2 1-1.4 1.3-3 1.1-4.6 2 1.9 3.2 3.9 3.2 6.5 0 3.3-2.2 5.9-5.4 5.9z" fill="var(--mint)"/>
          </svg>
          <small>Logo</small>
        </span>
      </button>
      <input type="file" id="logoFile" accept="image/png,image/jpeg,image/svg+xml,image/webp" hidden>
      <div class="brand-txt">
        <h1 class="titulo" id="titulo" contenteditable="true" spellcheck="false">Ignis Cup</h1>
        <div class="sub" id="periodo"></div>
      </div>
      <button class="brand-reset" id="brandReset" hidden>Restaurar padrão</button>
    </div>
    <div class="top-stats" id="topstats"></div>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="ranking">Ranking geral</button>
    <button role="tab" aria-selected="false" data-tab="semana">Semana a semana</button>
    <button role="tab" aria-selected="false" data-tab="universo">Universos</button>
    <button role="tab" aria-selected="false" data-tab="criterio">Critérios</button>
  </nav>
</header>

<main class="wrap">
  <section class="panel on" id="p-ranking"></section>
  <section class="panel" id="p-semana"></section>
  <section class="panel" id="p-universo"></section>
  <section class="panel" id="p-criterio"></section>
  <p class="foot" id="foot">Feito por PietroRantin</p>
</main>

<script src="js/app.js"></script>
</body>
</html>
